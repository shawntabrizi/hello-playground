<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5127F"/>
      <stop offset="1" stop-color="#B4005F"/>
    </linearGradient>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#4A0026" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- app background -->
  <rect x="0" y="0" width="1024" height="1024" rx="240" fill="url(#bg)"/>

  <!-- page -->
  <g filter="url(#pageShadow)">
    <rect x="282" y="196" width="460" height="600" rx="46" fill="#FFFFFF"/>
  </g>

  <!-- heading bar (accent) -->
  <rect x="338" y="266" width="240" height="44" rx="22" fill="#E6007A"/>

  <!-- image / block placeholder -->
  <rect x="338" y="344" width="348" height="158" rx="22" fill="#FFD3E8"/>

  <!-- body text lines -->
  <rect x="338" y="542" width="348" height="28" rx="14" fill="#E7E9EF"/>
  <rect x="338" y="592" width="348" height="28" rx="14" fill="#E7E9EF"/>
  <rect x="338" y="642" width="210" height="28" rx="14" fill="#E7E9EF"/>

  <!-- the dot: tap-to-build accent, overlapping page corner -->
  <circle cx="706" cy="732" r="92" fill="#FFFFFF"/>
  <circle cx="706" cy="732" r="72" fill="#E6007A"/>
</svg>
